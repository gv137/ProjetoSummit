<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Problemas Urbanos - Prefeitura</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="container">
        <header>
            <div class="logo">
                <img src="img/logo_prefeitura.png" alt="Logo da Prefeitura" id="logo-placeholder">
            </div>
            <h1>Registro de Problemas Urbanos</h1>
            <p class="subtitle">Ajude a melhorar nossa cidade</p>
        </header>

        <form id="problema-form">
            <div class="form-group">
                <label for="nome-cidadao">Seu Nome (opcional):</label>
                <input type="text" id="nome-cidadao" name="nome_cidadao" placeholder="Digite seu nome (opcional)">
            </div>

            <div class="form-group">
                <label for="contato">Contato (opcional):</label>
                <input type="text" id="contato" name="contato" placeholder="Email ou telefone para retorno (opcional)">
            </div>

            <div class="form-group">
                <label for="localizacao">Localização do Problema:</label>
                <input type="text" id="localizacao" name="localizacao" placeholder="Endereço ou referência" required>
                <button type="button" id="btn-gps" class="btn-secondary">Usar Minha Localização</button>
            </div>

            <div class="form-group">
                <label for="tipo-problema">Tipo de Problema:</label>
                <select id="tipo-problema" name="tipo_problema" required>
                    <option value="" disabled selected>Selecione...</option>
                    <option value="Buraco na Via">Buraco na Via</option>
                    <option value="Vazamento de Água">Vazamento de Água</option>
                    <option value="Iluminação Pública">Iluminação Pública</option>
                    <option value="Lixo/Entulho">Lixo/Entulho</option>
                    <option value="Calçada Danificada">Calçada Danificada</option>
                    <option value="Sinalização de Trânsito">Sinalização de Trânsito</option>
                    <option value="Árvore Caída/Risco">Árvore Caída/Risco</option>
                    <option value="Bueiro Entupido">Bueiro Entupido</option>
                    <option value="Outro">Outro</option>
                </select>
            </div>

            <div class="form-group" id="outro-problema-container" style="display: none;">
                <label for="outro-problema">Especifique o Problema:</label>
                <input type="text" id="outro-problema" name="outro_problema" placeholder="Descreva o tipo de problema">
            </div>

            <div class="form-group">
                <label for="descricao">Descrição Detalhada:</label>
                <textarea id="descricao" name="descricao" rows="4" placeholder="Descreva o problema com detalhes"
                    required></textarea>
            </div>

            <div class="form-group">
                <label for="foto-problema">Adicionar Foto (opcional):</label>
                <input type="file" id="foto-problema" name="foto_problema" accept="image/*" capture="environment">
                <div id="foto-preview" class="foto-preview"></div>
            </div>

            <div class="form-group">
                <label for="qr-code-id">ID do QR Code:</label>
                <input type="text" id="qr-code-id" name="qr_code_id" readonly>
                <p class="help-text">Este código identifica a localização do QR Code escaneado</p>
            </div>

            <button type="submit" class="btn-primary">Enviar Registro</button>

        

            <div class="button-container">
                <a href="instrutor.html" class="instructor-link">Sou Instrutor</a>
            </div>

        </form>
        <div id="mensagem-status"></div>
    </div>

    <footer>
        <p>&copy; 2025 Prefeitura Municipal. Todos os direitos reservados.</p>
        <p>Em caso de emergência, ligue para: <strong>190</strong> (Polícia), <strong>193</strong> (Bombeiros) ou
            <strong>192</strong> (SAMU)</p>
    </footer>

    <script src="js/script.js"></script>
</body>

</html>
